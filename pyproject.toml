[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatoken"
version = "0.1.0"
description = "A minimal educational backend for building a tiny ChatGPT-like LLM from scratch."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "torch>=2.0",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "tiktoken>=0.7",
  "requests>=2.32",
]
dev = [
  "pytest>=8.0",
  # starlette.testclient prefers httpx2 and warns when it falls back to httpx.
  # Nothing else in the project uses either, so httpx2 alone is enough.
  "httpx2>=2.0",
]

[tool.setuptools.packages.find]
where = ["packages/llm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
